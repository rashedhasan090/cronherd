[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cronherd"
version = "0.1.0"
description = "Find thundering herds, DST traps, and dead schedules across crontabs, GitHub Actions, and Kubernetes CronJobs."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Md Rashedul Hasan"}]
requires-python = ">=3.9"
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: System :: Systems Administration"]

[project.scripts]
cronherd = "cronherd.cli:main"

[tool.setuptools]
packages = ["cronherd"]
